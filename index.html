<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A股行业轮动与资金流向监控仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1320;--card:#151e2e;--card2:#1b2740;--line:#26354f;
  --txt:#e8eef7;--sub:#94a3c3;--red:#e0314f;--red2:#ff5c76;--green:#1fbf6e;--green2:#3ddc95;--gray:#5b6b8a;
  --up:#e0314f;--down:#1fbf6e;--accent:#4f8bff;
}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
body{padding:10px 10px 40px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:clamp(16px,4.4vw,22px);font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 8px var(--accent)}
.sub{color:var(--sub);font-size:clamp(11px,3vw,13px);margin-top:2px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(10px,3vw,16px);margin-top:12px}
.card h2{font-size:clamp(13px,3.6vw,16px);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:#cfe0ff}
.card h2::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
.tag{font-size:10px;color:var(--sub);background:var(--card2);padding:1px 6px;border-radius:4px;font-weight:500}
.ts{color:var(--accent);font-size:11px}
.err{color:var(--red);font-size:12px;padding:10px;background:var(--card2);border:1px dashed var(--red);border-radius:8px;text-align:center}
/* 大盘 */
.mkt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.mk{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.mk .nm{color:var(--sub);font-size:12px}
.mk .px{font-size:clamp(16px,4.6vw,22px);font-weight:800;margin:2px 0}
.mk .ch{font-size:12px;font-weight:600}
.mk .amt{color:var(--sub);font-size:11px;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
/* 热力图 */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.ht{border-radius:8px;padding:9px 6px;text-align:center;border:1px solid transparent;position:relative;overflow:hidden}
.ht .bn{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ht .cp{font-size:14px;font-weight:800;margin-top:2px}
.ht .fl{font-size:10px;opacity:.85;margin-top:1px}
.ht.na{background:#1c2435!important;border-color:var(--line);color:var(--gray)}
.ht.na .bn{color:var(--gray)}
.leg{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:8px;font-size:10.5px;color:var(--sub)}
.bar{width:42px;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--green2) 45%,#3a4560 50%,var(--red2) 55%,var(--red))}
/* 资金条形 */
.fbar{display:grid;grid-template-columns:100px 1fr 84px;gap:8px;align-items:center;padding:5px 0}
.fbar .rn{color:var(--sub);font-size:11px}
.fbar .nm{color:var(--txt);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .track{background:var(--card2);border-radius:5px;height:13px;position:relative;overflow:hidden}
.fbar .fill{position:absolute;top:0;bottom:0;border-radius:5px;height:100%}
.fbar .val{font-size:12px;font-weight:700;white-space:nowrap}
/* 分时 */
.tops{display:grid;grid-template-columns:1fr;gap:10px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.chip .hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chip .nm2{font-weight:800;font-size:15px}
.chip .sc{font-size:11px;color:var(--sub)}
.chip .px{font-size:18px;font-weight:800;margin-right:8px}
.chip canvas{width:100%;height:212px;display:block;border-radius:6px;background:#101a2c}
.kv{font-size:12px}
.kv .cell{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.kv .lb{color:var(--sub);font-size:10.5px;display:block;margin-bottom:1px}
.conds{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cond{font-size:10.5px;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.cond.ok{background:rgba(31,191,110,.14);border-color:var(--green);color:var(--green2)}
.cond.no{background:rgba(224,49,79,.1);border-color:var(--red);color:var(--red)}
/* 表格 */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;border:1px solid var(--line)}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:clamp(11px,3vw,13px);background:var(--card2)}
th{background:#1e2a44;color:#cfe0ff;padding:8px;text-align:center;position:sticky;top:0;white-space:nowrap}
td{padding:7px 8px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
.no-buy{font-size:10px;color:var(--red);font-weight:700}
/* 研判 */
.verdict{display:grid;gap:8px}
.vd{background:var(--card2);border-left:3px solid var(--accent);border-radius:6px;padding:9px 11px;font-size:clamp(12px,3.2vw,14px)}
.vd b{color:var(--red2)}
.vd .downv{color:var(--green2)}
.foot{text-align:center;color:#5b6b8a;font-size:10.5px;margin-top:16px;line-height:1.7}
.lock{font-size:10px;color:var(--sub);margin-top:10px;background:var(--card2);border:1px dashed var(--line);padding:6px 10px;border-radius:6px;line-height:1.6}
</style>
</head>

  <div class="foot">数据：东方财富(datacenter-web/新浪) + 腾讯实时兜底，每60s刷新 · 行业口径东财行业(近似申万一级)<br>红色=上涨，绿色=下跌，严格遵A股配色 · 仅供参考，不构成投资建议</div>

</div>

/* ============ 工具 ============ */
var UT="fa5fd1943c7b386f172d6893b0a54d2a";
function $(id){return document.getElementById(id)}
var RED="#e0314f", GREEN="#1fbf6e", RED2="#ff5d74", GREEN2="#3bd17f";
function cls(v){if(v===null||v===undefined||isNaN(v))return "flat";return v>0?"up":(v<0?"down":"flat")}
function fmt(v,d){if(v===null||v===undefined||isNaN(v))return "--";return (+v).toFixed(d||2)}
function fmtAmt(y){if(y===null||y===undefined||isNaN(y))return "--";var a=y/1e8;return (a<0?"-":"")+Math.abs(a).toFixed(1)+"亿";}
function heatColor(pct){
  if(pct===null||isNaN(pct))return "#222c40";
  var t=Math.min(Math.abs(pct)/6,1);
  if(pct>0){return "rgb("+Math.round(185+70*t)+","+Math.round(45+12*t)+","+Math.round(65+18*t)+")";}
  return "rgb("+Math.round(30+18*t)+","+Math.round(150+82*t)+","+Math.round(72+16*t)+")";
}

function posInfo(price){// 4万本金/整手100股/方案A(1/3≈1.3万) B(半仓≈2万)

}
/* JSONP 封装（带超时，返回 null 表示失败） */
function jp(url,dontUt){
  return new Promise(function(res){
    if(!dontUt)url=url+(url.indexOf("?")>-1?"&":"?")+"ut="+UT;
    var k="__cb"+Math.random().toString(36).slice(2,8);
    var t=setTimeout(function(){try{delete window[k]}catch(e){};var s=document.getElementById(k);if(s)s.remove();res(null)},7000);
    window[k]=function(d){clearTimeout(t);try{delete window[k]}catch(e){};var s=document.getElementById(k);if(s)s.remove();res(d)};
    var s=document.createElement("script");s.id=k;

  });
}

/* 腾讯大盘：script 加载 qt.gtimg 全局变量 */
function tencentMarket(){
  return new Promise(function(res){

    window[k]=function(){cleanup();
      var out=[];["sh000001","sz399001","sz399006","sh000688"].forEach(function(c){
        var v=window["v_"+c];if(!v)return;var p=v.split("~");out.push([c,+p[3],+p[1],+p[31]]);

    var s=document.createElement("script");s.id=k;s.charset="gbk";

}

  cachedBoards=bs;
  renderHeat(bs);renderFbar(bs);renderVerdict(bs);
  setSrc("行业","东财·"+bs.length+"板块");
}
function renderHeat(list){
  var arr=list.map(function(x){return {n:x.f14,chg:x.f3,code:x.f12,up:x.f104,down:x.f105,zt:x.f106}})
    .filter(function(x){return x.chg!==null&&!isNaN(x.chg)});
  arr.sort(function(a,b){return b.chg-a.chg});
  $("heat").innerHTML=arr.map(function(x){
    return '<div class="ht" style="background:'+heatColor(x.chg)+'"><div class="bn">'+x.n+'</div>'+
      '<div class="cp">'+fmt(x.chg)+'%</div>'+
      (x.zt!=null?'<div style="font-size:10px;opacity:.92;margin-top:1px">涨停 '+x.zt+'</div>':
       (x.up!=null?'<div style="font-size:10px;opacity:.8;margin-top:1px">涨'+x.up+'/跌'+x.down+'</div>':''))+
      '<div class="fl">'+x.code+'</div></div>';
  }).join("");
}
function renderFbar(list){
  var arr=list.map(function(x){return {n:x.f14,chg:x.f3,f62:x.f62}});
  var hasFund=arr.some(function(x){return x.f62!==null&&!isNaN(x.f62)});
  arr.forEach(function(x){x.v=(hasFund?(x.f62||0):(x.chg||0))});
  arr.sort(function(a,b){return b.v-a.v});
  var max=Math.max.apply(null,arr.map(function(x){return Math.abs(x.v)}))||1;
  var html="";
  arr.slice(0,22).forEach(function(x,i){
    var pos=x.v>=0, w=Math.round(Math.abs(x.v)/max*100);
    html+='<div class="fbar"><div class="nm" style="text-align:left"><span class="rn">'+(i+1)+'. </span>'+x.n+'</div>'+
      '<div class="track"><div class="fill" style="'+(pos?'left:50%;background:linear-gradient(90deg,'+RED+','+RED2+');':'right:50%;background:linear-gradient(90deg,'+GREEN2+','+GREEN+');')+'width:'+(w/2)+'%"></div></div>'+
      '<div class="val '+cls(x.v)+'">'+(hasFund?fmtAmt(x.f62):fmt(x.chg)+'%')+'</div></div>';
  });
  $("fbar").innerHTML=(html||'<div style="color:var(--red)">数据加载失败</div>')+
    (hasFund?'':'<div style="color:var(--sub);font-size:11px;margin-top:6px">⚠️ 主力资金字段未取到，本榜暂按涨跌幅排序</div>');
}
function renderVerdict(list){
  var arr=list.map(function(x){return {n:x.f14,chg:x.f3,f62:x.f62}});
  var hasFund=arr.some(function(x){return x.f62!==null&&!isNaN(x.f62)});
  var byChg=arr.filter(function(x){return x.chg!==null&&!isNaN(x.chg)}).sort(function(a,b){return b.chg-a.chg});
  var fund=arr.slice().sort(function(a,b){return (b.f62||0)-(a.f62||0)});
  var in3=(hasFund?fund:byChg).slice(0,3);
  var out3=(hasFund?fund.slice().reverse().slice(0,3):byChg.slice().reverse().slice(0,3)).reverse();
  var nlist=function(a){return a.map(function(x){return x.n}).join("/")};
  var t2=function(a){return a.map(function(x){return x.n+"<b>"+fmt(x.chg)+"%</b>"}).join("、")};
  var v1='<div class="vd">💧 <b>'+(hasFund?'资金主线·净流入Top3':'涨幅Top3')+'</b>：'+nlist(in3)+' 领跑，'+
     (hasFund?'主力合计净流入约 <b>'+fmtAmt(in3.reduce(function(s,x){return s+x.f62},0))+'</b>':'（资金字段缺失，暂按涨幅）')+'。</div>';
  var v2='<div class="vd">🧭 <b>资金流出压力</b>：<span class="downv">'+nlist(out3)+'</span> 居后，短线谨慎。</div>';
  var v3='<div class="vd">📈 <b>行情最强</b>：'+t2(byChg.slice(0,3))+'，可结合量价信号顺势参与。</div>';
  $("verdict").innerHTML=v1+v2+v3;
}

/* ============ ④ 量化Top3动态分时（东财 → 失败腾讯） ============ */
var TOP3=(QPOOL||[]).filter(function(x){var p=x.p;return p&&p>=15&&p<=60}).slice(0,3);
function tqcode(code){return /^6/.test(code)?"sh"+code:(/^[034]/.test(code)?"sz"+code:("bj"+code));}
function secid(code){return /^6/.test(code)?"1."+code:"0."+code;}
async function loadTrend(code,canvasId,statId){
  var st=document.getElementById(statId);if(st)st.innerHTML='<span style="color:var(--sub)">分时加载中…</span>';
  var qitem=null;QPOOL.forEach(function(x){if(x.c===code)qitem=x});
  var score=qitem?qitem.s:0;
  var url="https://push2his.eastmoney.com/api/qt/stock/trends2/get?secid="+secid(code)+"&fields1=f1,f2,f3,f4,f5,f6,f7,f8,f9,f10,f11,f12,f13&fields2=f51,f52,f53,f54,f55,f56,f57,f58&ndays=1&iscr=0";
  var d=await jp(url);
  if(d&&d.data&&d.data.trends){
    var items=(d.data.trends||[]).map(function(s){var a=s.split(',');return {p:+a[2],avg:+a[7],vol:+a[5]}});
    renderTrendData(canvasId,statId,items,d.data.prePrice||0,score);
    return;
  }
  var td=await tencentTrend(code);
  if(td)renderTrendData(canvasId,statId,td.pts,td.pre,score);
}
function renderTrendData(canvasId,statId,items,pre,score){
  drawTrend(canvasId,items,pre);
  var st=document.getElementById(statId);if(!st)return;
  if(!items||!items.length){st.innerHTML='<span style="color:var(--red)">分时无数据(休市中)</span>';return}
  var last=items[items.length-1];
  var price=last.p,avg=last.avg||price;
  var chg=pre?((price-pre)/pre*100):NaN;
  var hi=Math.max.apply(null,items.map(function(x){return x.p}));
  var lo=Math.min.apply(null,items.map(function(x){return x.p}));
  var buy=avg; var stop=buy*0.95; var target=buy*1.08; var chase=price>target;
  var sup=Math.min(lo,pre?pre*0.97:lo); var res=Math.max(hi,pre?pre*1.04:hi);
  var posv=posInfo(price);
  var posHtml=posv&&posv.can
    ? '<b style="color:var(--txt)">方案A 可买 <b style="color:var(--accent)">'+posv.out[0].hands+'手</b>(≈'+(posv.out[0].amt/10000).toFixed(2)+'万) &nbsp;·&nbsp; 方案B '+posv.out[1].hands+'手(≈'+(posv.out[1].amt/10000).toFixed(2)+'万)</b>'
    : '<b style="color:var(--red)">现价'+fmt(price)+'元不在15-60区间/金额不足整手，建议放弃</b>';
  st.innerHTML=
    '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">'+
      '<span class="px '+cls(chg)+'">'+fmt(price)+'</span>'+
      '<span class="'+cls(chg)+'">'+(chg>0?"▲+":"")+fmt(chg)+'%</span>'+
      '<span class="sc">均价 '+fmt(avg)+'</span>'+
      '<span class="sc" style="margin-left:auto;color:'+scoreColor(score)+';font-weight:800">评分 '+score.toFixed(3)+'</span>'+
    '</div>'+
    '<div class="kv" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">'+
      '<div class="cell"><span class="lb">昨收</span><b style="color:var(--sub)">'+fmt(pre)+'</b></div>'+
      '<div class="cell"><span class="lb">今日区间</span><b class="'+cls(chg)+'">'+fmt(lo)+' ~ '+fmt(hi)+'</b></div>'+
      '<div class="cell"><span class="lb">支撑(低)</span><b style="color:var(--green2)">'+fmt(sup)+'</b></div>'+
      '<div class="cell"><span class="lb">压力(高)</span><b style="color:var(--red2)">'+fmt(res)+'</b></div>'+
      '<div class="cell"><span class="lb">建议买(低吸)</span><b style="color:var(--accent)">≤ '+fmt(buy)+'</b></div>'+
      '<div class="cell"><span class="lb">建议卖(目标+8%)</span><b style="color:'+(chase?'var(--red)':'var(--green2)')+'">'+(chase?'⚠️已超目标·勿追':'≥ '+fmt(target))+'</b></div>'+
      '<div class="cell" style="grid-column:1/-1"><span class="lb">止损 -5% / 操作</span><b style="color:var(--red)">'+fmt(stop)+'</b>'+
      ' <b style="color:'+(chase?'var(--red)':'var(--txt)')+'">· '+(chase?'现价已高于目标位、追高亏损风险大，等回踩':(chg>0?'偏多、回踩低吸':'观望、等企稳'))+'</b></div>'+
      '<div class="cell" style="grid-column:1/-1;margin-top:-4px"><span class="lb">实盘可选(整手·4万)</span>'+posHtml+'</div>'+
    '</div>'+
    '<div class="conds">'+
      '<span class="cond '+(price>avg?'ok':'no')+'">现价在均线上 '+(price>avg?"✓":"✗")+'</span>'+
      '<span class="cond '+(chg>0?'ok':'no')+'">今日上涨 '+(chg>0?"✓":"✗")+'</span>'+
      '<span class="cond '+(score>=0.5?'ok':'no')+'">评分≥0.5 '+(score>=0.5?"✓":"✗")+'</span>'+
      '<span class="cond ok">量价策略入选</span>'+
    '</div>';
}
function drawTrend(cv,items,pre){
  var c=document.getElementById(cv);if(!c)return;
  var ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
  if(!items||!items.length)return;
  var W=c.width=Math.max(320,c.offsetWidth*2),H=c.height=440;
  var N=items.length,n=Math.max(1,N);
  var priceH=Math.round(H*0.70),volY0=priceH+10,volY1=H-10;
  var prices=items.map(function(x){return x.p});
  var avgs=items.map(function(x){return x.avg||x.p});
  var vols=items.map(function(x){return x.vol||0});
  var all=prices.concat(avgs).concat([pre]).filter(function(v){return isFinite(v)&&v>0});
  if(!all.length)return;
  var min=Math.min.apply(null,all),max=Math.max.apply(null,all);
  var pad=10,x0=pad,x1=W-pad,y0=20,y1=priceH,rng=(max-min)||1;
  var X=function(i){return x0+(x1-x0)*i/(n-1)},Y=function(v){return y1-(y1-y0)*(v-min)/rng};
  ctx.strokeStyle="rgba(255,255,255,.06)";ctx.lineWidth=1;
  for(var g=0;g<=4;g++){ctx.beginPath();ctx.moveTo(x0,y0+(y1-y0)*g/4);ctx.lineTo(x1,y0+(y1-y0)*g/4);ctx.stroke()}
  if(pre&&pre>0){ctx.setLineDash([4,4]);ctx.strokeStyle="rgba(255,255,255,.3)";ctx.beginPath();ctx.moveTo(x0,Y(pre));ctx.lineTo(x1,Y(pre));ctx.stroke();ctx.setLineDash([])}
  ctx.strokeStyle="rgba(31,191,110,.7)";ctx.lineWidth=1.3;ctx.beginPath();
  for(var j=0;j<n;j++){j==0?ctx.moveTo(X(j),Y(avgs[j])):ctx.lineTo(X(j),Y(avgs[j]))}ctx.stroke();
  var lastv=prices[prices.length-1],up=lastv>=(pre||lastv);
  ctx.strokeStyle=up?"#ff5c76":"#2fd088";ctx.lineWidth=2;ctx.beginPath();
  for(var i=0;i<n;i++){i==0?ctx.moveTo(X(i),Y(prices[i])):ctx.lineTo(X(i),Y(prices[i]))}ctx.stroke();
  var vmax=Math.max.apply(null,vols)||1,bW=Math.max(1,(x1-x0)/n*0.55);
  for(var k=0;k<n;k++){var v=vols[k];if(!v)continue;
    var prev=(k>0)?prices[k-1]:(pre||prices[k]);
    ctx.fillStyle=(prices[k]>=prev)?"rgba(255,92,118,.72)":"rgba(47,208,136,.72)";
    var bh=(volY1-volY0)*(v/vmax);
    ctx.fillRect(X(k)-bW/2,volY1-bh,bW,bh);
  }
  ctx.fillStyle="#8aa0c5";ctx.font=Math.round(W/24)+"px sans-serif";ctx.textAlign="left";
  ctx.fillText("昨收 "+fmt(pre)+"  高 "+fmt(max)+"  低 "+fmt(min),x0+2,y0-4);
  ctx.fillText("量",x0+2,volY1+12);
}
function tencentTrend(code){
  return new Promise(function(res){
    var url="https://proxy.finance.qq.com/ifzqgtimg/appstock/app/minute/query?code="+tqcode(code);
    var k="__cb"+Math.random().toString(36).slice(2,8);
    var t=setTimeout(function(){try{delete window[k]}catch(e){};var s=document.getElementById(k);if(s)s.remove();res(null)},7000);
    window[k]=function(d){clearTimeout(t);try{delete window[k]}catch(e){};var s=document.getElementById(k);if(s)s.remove();
      if(!d||d.code!==0||!d.data)return res(null);
      var node=d.data[tqcode(code)];
      if(!node||!node.data||!node.data.data)return res(null);
      var pre=node.data.qt?+(node.data.qt[5]||0):0;
      var pts=node.data.data.map(function(s){var a=s.split(" ");return {p:+a[1],avg:0,vol:+a[2]}});
      res({pts:pts,pre:pre});
    };
    var s=document.createElement("script");s.id=k;
    s.src=url+"&_callback="+k;
    s.onerror=function(){try{delete window[k]}catch(e){};var s=document.getElementById(k);if(s)s.remove();res(null)};
    document.head.appendChild(s);
  });
}
/* ============ ⑤ 股池表 ============ */
function trendBadge(t){
  if(!t)return '<span style="color:var(--sub);font-size:11px">-</span>';
  var m={"多头":"var(--green2)","反转":"#4a9eff","观望":"#f0b90b","回避":"var(--red)","-":"var(--sub)"};
  var col=m[t]||"var(--sub)";
  return '<span title="'+t+'" style="display:inline-block;color:'+col+';font-weight:700;border:1px solid '+col+';border-radius:4px;padding:1px 6px;font-size:11px;white-space:nowrap">'+t+'</span>';
}
function renderPool(){
  $("pool").innerHTML=QPOOL.map(function(x,i){
    var can=(x.p>=15&&x.p<=60);
    return '<tr><td>'+(i+1)+'</td><td>'+x.c+'</td><td style="text-align:left;font-weight:600">'+x.n+'</td>'+
      '<td style="color:'+scoreColor(x.s)+';font-weight:700">'+x.s.toFixed(3)+'</td><td>'+x.sec+'</td>'+
      '<td>'+fmt(x.p)+'</td><td class="'+cls(x.g)+'">'+(x.g>0?"+":"")+fmt(x.g)+'%</td>'+
      '<td>'+(can?'<span style="color:var(--green2)">可整手买</span>':'<span class="no-buy">超15-60区间</span>')+'</td>'+
      '<td>'+trendBadge(x.t)+'</td></tr>';
  }).join("");
}
function renderTops(){
  $("tops").innerHTML=TOP3.map(function(s,i){
    return '<div class="chip"><div class="hd"><span class="nm2">'+(i+1)+'. '+s.n+' <span class="sc">'+s.c+' · '+s.sec+'</span></span>'+
      '<span class="sc">评分 '+s.s+' '+trendBadge(s.t)+'</span></div><canvas id="cv'+s.c+'"></canvas><div id="st'+s.c+'" style="margin-top:8px"></div></div>';
  }).join("");
  TOP3.forEach(function(s){loadTrend(s.c,"cv"+s.c,"st"+s.c)});
}

/* ============ 主循环 ============ */
window.onerror=function(msg,s,l){var el=document.getElementById("srcStatus");if(el)el.innerHTML+='<span style="color:var(--red)">JS L'+l+':'+msg+'</span>';};
function setSrc(name,st){var el=document.getElementById("srcStatus");if(el)el.innerHTML+='<span style="margin-right:10px">▪ '+name+'：'+st+'</span>';}
async function refreshAll(){
  var el=document.getElementById("srcStatus");if(el)el.innerHTML="";

  var n=new Date();
  $("ts").textContent=(n.getHours()<10?"0":"")+n.getHours()+":"+(n.getMinutes()<10?"0":"")+n.getMinutes()+":"+(n.getSeconds()<10?"0":"")+n.getSeconds();
  renderPool();
  loadMarket();
  loadIndustries();
  renderTops();
}
refreshAll();
setInterval(refreshAll,60000);
